; 公式イメージの www.conf / zz-docker.conf（listen = 9000）の後に読み込まれる
[www]
; ECS がコンテナに渡す環境変数（SSM の値など）を Laravel から読めるようにする
; 既定の clear_env = yes のままだと、PHP ワーカーから環境変数が見えない
clear_env = no

; Laravel の LOG_CHANNEL=stderr の出力を CloudWatch Logs に流す
catch_workers_output = yes
decorate_workers_output = no

; タスクのメモリ 0.5GB（nginx と共有）に合わせた上限
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
