server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # 管理画面の画像アップロード（php.ini の upload_max_filesize と合わせる）
    client_max_body_size 10m;

    # ALB 経由の利用者の IP をログに残す（VPC 10.0.0.0/16 内の ALB を信頼）
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ALB のヘルスチェック。nginx だけでなく Laravel（PHP-FPM）まで動いているかを確認する
    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # 静的ファイルは nginx が直接返す（無ければ 404。Laravel には渡さない）
    location ~* \.(?:css|js|map|jpe?g|png|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # .env や .git などの隠しファイルは返さない
    location ~ /\.(?!well-known) {
        deny all;
    }
}
